<div class="popover">
  <button type="button" class="info-button" (click)="toggle()" aria-label="Base status legend">
    i
  </button>
  <div *ngIf="open" class="panel">
    <div class="panel-title">Base Status Legend</div>
    <div class="panel-row" *ngFor="let item of definitions">
      <div class="panel-label">{{ item.label }}</div>
      <div class="panel-text">{{ item.description }}</div>
    </div>
  </div>
</div>
